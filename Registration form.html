<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <fieldset>
            <legend>Personal Details</legend>

            <label>Full Name:</label><br>
            <input type="text" placeholder="Enter your full name"><br><br>

            <label>Father's Name:</label><br>
            <input type="text" placeholder="Enter father's name"><br><br>

            <label>Mother's Name:</label><br>
            <input type="text" placeholder="Enter mother's name"><br><br>

            <label>Date of Birth:</label><br>
            <input type="date"><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Contact Details</legend>

            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email"><br><br>

            <label>Phone Number:</label><br>
            <input type="tel" placeholder="Enter your phone number"><br><br>

            <label>Address:</label><br>
            <textarea rows="4" cols="40" placeholder="Enter your address"></textarea><br><br>

            <label>City:</label><br>
            <select>
                <option>Select City</option>
                <option>Srinagar</option>
                <option>Delhi</option>
                <option>Mumbai</option>
                <option>Bengaluru</option>
            </select>

        </fieldset>

        <br>

        <fieldset>
            <legend>Course Details</legend>

            <label>Select Course:</label><br>
            <select>
                <option>Select Course</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
                <option>Python</option>
            </select>

            <br><br>

            <label>Skills:</label><br>
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> Python
            <input type="checkbox"> Java
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Account Details</legend>

            <label>Username:</label><br>
            <input type="text" placeholder="Create a username"><br><br>

            <label>Password:</label><br>
            <input type="password" placeholder="Create a password"><br><br>

            <label>Upload Photo:</label><br>
            <input type="file"><br><br>

        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
